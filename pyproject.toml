[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "sourced-rag-pipeline"
version = "0.1.0"
description = "RAG pipeline that answers with citations to retrieved sources, or abstains when evidence is insufficient."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karim Mike Rahhal" }]
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
